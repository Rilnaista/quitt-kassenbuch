name: Release
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Version aus Tag
        id: v
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          case "$VERSION" in *-rc*) echo "pre=true" >> "$GITHUB_OUTPUT";; *) echo "pre=false" >> "$GITHUB_OUTPUT";; esac
          # Bis zur ersten stabilen Version gibt es nur RCs -> :latest zeigt immer auf den neuesten Tag
          echo "latest=true" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, zip
          tools: composer

      - name: Release-Paket bauen
        run: scripts/build-release.sh "${{ steps.v.outputs.version }}"

      - name: GitHub-Release
        uses: softprops/action-gh-release@v3
        with:
          prerelease: ${{ steps.v.outputs.pre == 'true' }}
          generate_release_notes: true
          files: |
            dist-release/quitt-${{ steps.v.outputs.version }}.zip
            dist-release/quitt-${{ steps.v.outputs.version }}.zip.sha256
            dist-release/setup.php

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image bauen und pushen (amd64 + arm64)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ steps.v.outputs.version }}
          tags: |
            ghcr.io/rilnaista/quitt-kassenbuch:${{ steps.v.outputs.version }}
            ${{ steps.v.outputs.latest == 'true' && 'ghcr.io/rilnaista/quitt-kassenbuch:latest' || '' }}
