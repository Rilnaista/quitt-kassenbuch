<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1F8A5B">
  <title>Quitt – offline</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <style>
    html, body { margin: 0; height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { display: flex; align-items: center; justify-content: center; text-align: center; background: #1F8A5B; color: #fff; padding: 24px; box-sizing: border-box; }
    svg { width: 72px; height: 72px; }
    h1 { font-size: 22px; margin: 16px 0 8px; }
    p { max-width: 340px; line-height: 1.45; margin: 0 auto 20px; opacity: .95; }
    button { min-height: 44px; padding: 0 22px; border: 0; border-radius: 22px; background: #fff; color: #0c3b26; font: inherit; font-weight: 600; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <svg viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="14" fill="rgba(255,255,255,.22)"/><g fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"><path d="M38.5 48.1A20 20 0 1 1 47.3 20"/><path d="M23 32l11 11 22-29"/></g></svg>
    <h1>Gerade keine Verbindung</h1>
    <p>Quitt konnte nicht geladen werden. Sobald du wieder Netz hast, geht es weiter – deine Buchungen auf diesem Gerät bleiben erhalten.</p>
    <button type="button" onclick="location.reload()">Erneut versuchen</button>
  </main>
</body>
</html>
